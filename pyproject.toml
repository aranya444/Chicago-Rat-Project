[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago_rat_project"
version = "0.1.0"
description = "Preprocess Chicago rodent baiting data into a GeoDataFrame"
requires-python = ">=3.9"
dependencies = [
"panda>=3.0.6", 
"openpyxl>=3.1.5", 
"geopandas>=1.2.0", 
"matplotlib>=3.11.2", 
"scipy>=1.18.1", 
"plotly>=7.1.0", 
"pyogrio", 
"numpy>=2.5.3", 
"PyWeekends",
]

[tool.setuptools]
packages = ["chicago_rat_project"]

[tool.setuptools.package-data]
chicago_rat_project = ["data/*.geojson"]
